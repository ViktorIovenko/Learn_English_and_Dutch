<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Multilingual vocabulary connected to one concept</title>
  <desc id="desc">A ParallelLingvo illustration showing Dutch, English and Russian words connected around one shared concept.</desc>
  <defs>
