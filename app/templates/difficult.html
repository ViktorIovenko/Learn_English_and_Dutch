{% extends "base.html" %}
{% block title %}{{ t("nav.difficult") }}{% endblock %}
{% block content %}
<link rel="stylesheet" href="{{ url_for('static', filename='learn.css') }}">
<div id="learn-root" data-mode="difficult" class="learn-page">
  <div class="topbar">
    <a href="{{ url_for('web.home') }}" class="pill-btn">← {{ t("learn.back_to_lessons") }}</a>
    <a href="#" class="pill-btn ghost">{{ t("nav.difficult") }}</a>
  </div>

  <div id="progress" class="center-progress"></div>

  <div id="difficult-language-switch" class="lang-switch">
    <button data-lang=""  class="lang-btn">{{ t("common.all") }}</button>
  </div>

  <div id="word-view" class="card"></div>

  <div id="answer-slots" class="answer-field"></div>
  <div id="letters-pool" class="letter-grid"></div>

  <div class="builder">
    <div class="builder-controls">
      <div class="controls-row split">
        <button id="clear-btn" class="ctrl-btn">{{ t("difficult.clear") }}</button>
        <button id="undo-btn" class="ctrl-btn">↩ {{ t("difficult.undo") }}</button>
      </div>
      <div class="controls-row center">
        <button id="check-btn" class="ctrl-btn check-btn">{{ t("learn.check") }}</button>
      </div>
    </div>
    <div class="nav-row">
      <button id="prev-btn" class="ctrl-btn">← {{ t("learn.previous_word") }}</button>
      <button id="next-btn" class="ctrl-btn">{{ t("learn.next_word") }} →</button>
    </div>
  </div>

  <!-- Модалка результата -->
  <div id="result-modal" class="modal" style="display:none" role="dialog" aria-modal="true" aria-labelledby="modal-line1">
    <div class="modal-content" id="modal-content"><!-- [ДОБАВЛЕНО] id для делегата -->
      <div class="modal-head">
        <div class="modal-head-actions">
          <label class="flag-toggle" title="{{ t('learn.mark_difficult') }}">
            <input type="checkbox" id="difficultToggle" checked>
            <span class="icon">★</span>
          </label>
          <button id="modal-close" class="close" aria-label="{{ t('common.close') }}">×</button>
        </div>
      </div>
      <p id="modal-line1"></p>
      <p id="modal-line2"></p>
      <p id="modal-line3"></p>
      <div class="controls-row center" style="margin-top:12px">
        <button id="next-word-btn" class="ctrl-btn">{{ t("learn.next_word_button") }}</button>
        <!-- без «Следующий урок» -->
      </div>
    </div>
  </div>
</div>
{% endblock %}
{% block scripts %}
<script defer src="{{ url_for('static', filename='audio_worker.js', v='20261003-shared-audio') }}"></script>
<script defer src="{{ url_for('static', filename='difficult.js') }}"></script>
{% endblock %}
