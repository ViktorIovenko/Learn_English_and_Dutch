{% extends "base.html" %}
{% block content %}
<style>
.admin-page { max-width: 720px; margin: 22px auto; color: #0f172a; }
.admin-card { border: 1px solid #e2e8f0; border-radius: 12px; background: #fff; box-shadow: 0 4px 16px rgba(15, 23, 42, .05); }
.admin-note { padding: 18px; color: #64748b; }
</style>
<div class="admin-page" data-legacy-i18n>
  <div class="admin-top">
    <h1 class="admin-title">Пользователи</h1>
    <a class="back-link" href="{{ url_for('web.home') }}">К урокам</a>
  </div>

  {% if access_pending or access_denied %}
    <div class="admin-card">
      <div class="admin-note" id="admin-access-message">
        {% if access_pending %}
          Проверяю доступ администратора...
        {% else %}
          Доступ пока не подтвержден. Проверяю Telegram-сессию...
        {% endif %}
      </div>
    </div>
    <script>
    (function(){
      let tries = 0;
      const msg = document.getElementById("admin-access-message");
      async function checkAdminAccess(){
        tries += 1;
        try {
          const resp = await fetch("/api/me", {credentials: "same-origin"});
          const data = await resp.json();
          if (data && data.ok && data.is_admin) {
            window.location.reload();
            return;
          }
          if (data && data.ok && data.auth && !data.is_admin) {
            if (tries > 6) {
              if (msg) msg.textContent = "Доступ запрещен. Эта страница открыта только для Telegram ID админов.";
              return;
            }
          }
        } catch(e) {}
        if (tries < 30) {
          setTimeout(checkAdminAccess, 500);
        } else if (msg) {
          msg.textContent = "Доступ запрещен. Откройте страницу из Telegram под администратором.";
        }
      }
      window.addEventListener("load", function(){ setTimeout(checkAdminAccess, 700); });
    })();
    </script>
  {% endif %}
</div>
{% endblock %}
