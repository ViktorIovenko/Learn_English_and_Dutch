<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7f8fc">
  <title>{% block title %}LearnWord — learn across languages{% endblock %}</title>
  <meta name="description" content="{% block description %}Learn vocabulary across three or more languages in one simple learning flow.{% endblock %}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='marketing.css') }}">
</head>
<body>
  <header class="site-header">
    <div class="shell nav-wrap">
      <a class="brand" href="{{ url_for('marketing.landing') }}" aria-label="LearnWord home">
        <span class="brand-mark" aria-hidden="true">L</span>
        <span>LearnWord</span>
      </a>

      <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="mainNav">Menu</button>

      <nav class="nav-links" id="mainNav" aria-label="Primary navigation">
        <a href="{{ url_for('marketing.landing') }}#how-it-works">How it works</a>
        <a href="{{ url_for('marketing.landing') }}#features">Features</a>
        <a href="{{ url_for('marketing.blog') }}">Blog</a>
        <a class="button button-small button-secondary" href="/">Open app</a>
      </nav>
    </div>
  </header>

  <main>
    {% block content %}{% endblock %}
  </main>

  <footer class="site-footer">
    <div class="shell footer-grid">
      <div>
        <a class="brand footer-brand" href="{{ url_for('marketing.landing') }}">
          <span class="brand-mark" aria-hidden="true">L</span>
          <span>LearnWord</span>
        </a>
        <p>One vocabulary flow for three or more languages.</p>
      </div>
      <div class="footer-links">
        <a href="{{ url_for('marketing.landing') }}#features">Features</a>
        <a href="{{ url_for('marketing.blog') }}">Blog</a>
        <a href="/">Open app</a>
      </div>
    </div>
    <div class="shell footer-bottom">© 2026 LearnWord</div>
  </footer>

  <script>
    const toggle = document.querySelector('.nav-toggle');
    const nav = document.getElementById('mainNav');
    if (toggle && nav) {
      toggle.addEventListener('click', () => {
        const isOpen = nav.classList.toggle('is-open');
        toggle.setAttribute('aria-expanded', String(isOpen));
      });
    }
  </script>
</body>
</html>
