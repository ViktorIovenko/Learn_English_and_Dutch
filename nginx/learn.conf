# ParallelLingvo application: app.parallellingvo.app
server {
    listen 80;
    server_name app.parallellingvo.app;

    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://app.parallellingvo.app$request_uri; }
}

server {
    listen 443 ssl;
    http2 on;
    server_name app.parallellingvo.app;

    ssl_certificate     /etc/letsencrypt/live/app.parallellingvo.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.parallellingvo.app/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    client_max_body_size 20m;

    location = /mcp {
        proxy_pass http://mcp-gateway:8000/mcp;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300;
        proxy_send_timeout 300;
    }

    location = /.well-known/oauth-protected-resource/mcp {
        proxy_pass http://mcp-gateway:8000/.well-known/oauth-protected-resource/mcp;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://learn-words:7001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300;
    }
}

