# Legacy application domain: learn.iovenko.eu
# Keep the old hostname alive only as a redirect during migration.

server {
    listen 80;
    server_name learn.iovenko.eu;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://app.parallellingvo.app$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name learn.iovenko.eu;

    ssl_certificate     /etc/letsencrypt/live/learn.iovenko.eu/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/learn.iovenko.eu/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Frame-Options SAMEORIGIN;
    add_header X-Content-Type-Options nosniff;

    return 301 https://app.parallellingvo.app$request_uri;
}
