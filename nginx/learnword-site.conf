# Old public URLs from earlier versions of the site (Google still crawls
# them and reported 404s): send each to its closest current page with 301.
map $uri $legacy_target {
    default "";
    "~^/(de|es|fr|it|ja|pl|pt|zh|nl)/?$" /;
    "~^/(de|es|fr|it|ja|pl|pt|zh)/" /;
    "~^/nl/blog(/.*)?$" /blog/;
    "~^/nl/" /;
    "~^/(ru/)?blog/how-to-learn-vocabulary-in-three-languages/?$" /blog/how-to-learn-multiple-languages-at-the-same-time-without-mix-e496c345/;
    "~^/(ru/)?blog/organize-multilingual-vocabulary/?$" /blog/one-word-multiple-languages-a-better-way-to-build-multilingu-932b4aad/;
    "~^/blog/telegram-mini-app-language-learning/?$" /blog/;
    "~^/ru/blog/telegram-mini-app-language-learning/?$" /ru/blog/;
    "~^/(base|brand|i18n|landing|responsive)\.css$" /assets/styles.css;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    # This container sits behind the TLS proxy on plain port 80. Absolute
    # redirects (/blog -> /blog/) would point at http:// and add a second hop
    # through the proxy's https redirect; relative ones keep the visitor's scheme.
    absolute_redirect off;

    # Security headers are set once by the public proxy (nginx/parallellingvo.conf);
    # repeating them here sent every header twice.

    # One URL per page: /index.html and /blog/x/index.html duplicate their directory.
    if ($request_uri ~ "^([^?]*/)index\.html(\?.*)?$") {
        return 301 $1$2;
    }

    # Production branding compatibility layer. This makes the public response
    # use the final ParallelLingvo name/domain while the static source cleanup
    # can continue independently.
    sub_filter_once off;
    sub_filter_types *;
    sub_filter 'LearnWord' 'ParallelLingvo';
    sub_filter 'learnword.iovenko.eu' 'parallellingvo.app';
    sub_filter '<link rel="stylesheet" href="/styles.css">' '<link rel="icon" type="image/svg+xml" href="/favicon.svg"><meta name="theme-color" content="#5D12C7"><link rel="stylesheet" href="/styles.css">';

    if ($legacy_target) {
        return 301 $legacy_target;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    # Admin shell: a static page only; data and rights come from the app API
    # (app.parallellingvo.app/api/admin/*), which checks the session itself.
    location /admin/ {
        try_files $uri $uri/ =404;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header X-Frame-Options DENY always;
        add_header Cache-Control "no-store" always;
    }

    # Untranslated posts have only the English page (the builder no longer
    # emits duplicate /ru/ copies); send old or guessed /ru/ URLs to it.
    location /ru/blog/ {
        try_files $uri $uri/ @untranslated_post;
    }

    location @untranslated_post {
        set $en_post "/-no-such-post";
        if ($uri ~ "^/ru(/blog/[a-z0-9-]+)/?$") {
            set $en_post $1;
        }
        if (-f $document_root${en_post}/index.html) {
            return 301 $en_post/;
        }
        return 404;
    }

    location = /favicon.ico {
        default_type image/svg+xml;
        try_files /favicon.svg =404;
        expires 7d;
    }

    location ~* \.md$ {
        default_type text/markdown;
        try_files $uri @legacy_md;
        add_header Cache-Control "public, max-age=300";
    }

    # Markdown copies of the old site (/index.md, /blog/index.md, ...).
    location @legacy_md {
        rewrite ^/(.*/)?index\.md$ /$1 permanent;
        return 301 /;
    }

    location = /llms.txt {
        default_type text/plain;
        try_files $uri =404;
        add_header Cache-Control "public, max-age=300";
    }

    location = /llms-full.txt {
        default_type text/plain;
        try_files $uri =404;
        add_header Cache-Control "public, max-age=300";
    }

    location = /robots.txt {
        default_type text/plain;
        try_files $uri =404;
        add_header Cache-Control "public, max-age=300";
    }

    # CSS/JS change often during active development and carry no cache-busting
    # hash in their filename, so they must always be revalidated — a long
    # immutable cache here silently serves stale JS/CSS to returning visitors.
    location ~* \.(css|js)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=0, must-revalidate";
    }

    location ~* \.(svg|png|jpg|jpeg|webp|ico)$ {
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }
}
