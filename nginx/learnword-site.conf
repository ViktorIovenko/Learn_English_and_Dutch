server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Production branding compatibility layer. This makes the public response
    # use the final ParallelLingvo name/domain while the static source cleanup
    # can continue independently.
    sub_filter_once off;
    sub_filter_types *;
    sub_filter 'LearnWord' 'ParallelLingvo';
    sub_filter 'learnword.iovenko.eu' 'parallellingvo.app';
    sub_filter '<link rel="stylesheet" href="/styles.css">' '<link rel="icon" type="image/svg+xml" href="/favicon.svg"><meta name="theme-color" content="#5D12C7"><link rel="stylesheet" href="/styles.css">';

    location / {
        try_files $uri $uri/ =404;
    }

    location ~* \.md$ {
        default_type text/markdown;
        try_files $uri =404;
        add_header Cache-Control "public, max-age=300";
    }

    location = /llms.txt {
        default_type text/plain;
        try_files $uri =404;
        add_header Cache-Control "public, max-age=300";
    }

    location = /llms-full.txt {
        default_type text/plain;
        try_files $uri =404;
        add_header Cache-Control "public, max-age=300";
    }

    location = /robots.txt {
        default_type text/plain;
        try_files $uri =404;
        add_header Cache-Control "public, max-age=300";
    }

    location ~* \.(css|js|svg|png|jpg|jpeg|webp|ico)$ {
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }
}
