# ParallelLingvo public website: parallellingvo.app
# Static AI-indexable marketing site. The application lives on app.parallellingvo.app.

server {
    listen 80;
    server_name parallellingvo.app www.parallellingvo.app;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://parallellingvo.app$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name parallellingvo.app www.parallellingvo.app;

    ssl_certificate     /etc/letsencrypt/live/parallellingvo.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/parallellingvo.app/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    if ($host = www.parallellingvo.app) {
        return 301 https://parallellingvo.app$request_uri;
    }

    # Login buttons on the static marketing site hand off to the application.
    location = /auth/google {
        return 302 https://app.parallellingvo.app/auth/google$is_args$args;
    }

    location = /auth/telegram {
        return 302 https://app.parallellingvo.app/auth/telegram$is_args$args;
    }

    location = /auth/logout {
        return 302 https://app.parallellingvo.app/auth/logout$is_args$args;
    }

    location = /app {
        return 302 https://app.parallellingvo.app/$is_args$args;
    }

    location / {
        proxy_pass         http://learnword-site:80;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60;
    }
}
