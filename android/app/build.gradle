plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'com.google.devtools.ksp'
}

android {
    namespace 'app.parallellingvo'
    compileSdk 36

    defaultConfig {
        applicationId "app.parallellingvo"
        // Public OAuth client ID. Client secrets belong only on the server.
        def telegramClientId = System.getenv('TELEGRAM_CLIENT_ID') ?: '8903357617'
        buildConfigField "String", "TELEGRAM_CLIENT_ID", '"' + telegramClientId + '"'
        // Native App URL is generated separately by BotFather; it is not the client ID.
        def telegramLoginHost = 'app4151474097-login.tg.dev'
        buildConfigField "String", "TELEGRAM_LOGIN_HOST", '"' + telegramLoginHost + '"'
        manifestPlaceholders = [telegramLoginHost: telegramLoginHost]
        minSdk 24
        targetSdk 36
        versionCode = (System.getenv('PLAY_VERSION_CODE') ?: '2').toInteger()
        versionName = System.getenv('PLAY_VERSION_NAME') ?: "1.2"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        buildConfigField "String", "BASE_URL", '"https://app.parallellingvo.app/"'
    }

    def signingValues = ['PLAY_UPLOAD_STORE_FILE', 'PLAY_UPLOAD_STORE_PASSWORD',
                         'PLAY_UPLOAD_KEY_ALIAS', 'PLAY_UPLOAD_KEY_PASSWORD'].collect { System.getenv(it) }
    if (signingValues.any { it } && !signingValues.every { it }) {
        throw new GradleException('Supply all four PLAY_UPLOAD_* signing variables, or none for an unsigned bundle.')
    }
    signingConfigs {
        if (signingValues.every { it }) {
            playUpload {
                storeFile file(signingValues[0])
                storePassword signingValues[1]
                keyAlias signingValues[2]
                keyPassword signingValues[3]
            }
        }
    }

    buildTypes {
        release {
            if (signingValues.every { it }) signingConfig signingConfigs.playUpload
            debuggable false
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    buildFeatures {
        viewBinding true
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    def nav_version = "2.7.7"
    def lifecycle_version = "2.7.0"
    def room_version = "2.8.4"
    def retrofit_version = "2.9.0"
    def okhttp_version = "4.12.0"

    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation 'androidx.viewpager2:viewpager2:1.0.0'

    // Navigation
    implementation "androidx.navigation:navigation-fragment-ktx:$nav_version"
    implementation "androidx.navigation:navigation-ui-ktx:$nav_version"

    // ViewModel + LiveData + Coroutines
    implementation "androidx.lifecycle:lifecycle-viewmodel-ktx:$lifecycle_version"
    implementation "androidx.lifecycle:lifecycle-livedata-ktx:$lifecycle_version"
    implementation "androidx.lifecycle:lifecycle-runtime-ktx:$lifecycle_version"
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'

    // Room
    implementation "androidx.room:room-runtime:$room_version"
    implementation "androidx.room:room-ktx:$room_version"
    ksp "androidx.room:room-compiler:$room_version"

    // Retrofit + OkHttp + Gson
    implementation "com.squareup.retrofit2:retrofit:$retrofit_version"
    implementation "com.squareup.retrofit2:converter-gson:$retrofit_version"
    implementation "com.squareup.okhttp3:okhttp:$okhttp_version"
    implementation "com.squareup.okhttp3:okhttp-urlconnection:$okhttp_version"
    implementation "com.squareup.okhttp3:logging-interceptor:$okhttp_version"

    // DataStore
    implementation 'androidx.datastore:datastore-preferences:1.0.0'

    // WorkManager (background sync)
    implementation 'androidx.work:work-runtime-ktx:2.9.0'

    // FlexboxLayout (letter tiles grid)
    implementation 'com.google.android.flexbox:flexbox:3.0.0'

    // QR generation for parent/child account pairing
    implementation 'com.google.zxing:core:3.5.3'
    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'

    // Google Play Billing
    implementation 'com.android.billingclient:billing-ktx:9.1.0'

    // Google account selection and ID-token sign-in
    implementation project(':telegram-login')
    implementation 'com.google.android.gms:play-services-auth:21.2.0'

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}
