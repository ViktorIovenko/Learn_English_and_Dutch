version: '3.8'

services:
  learnword-site:
    image: nginx:1.27-alpine
    restart: unless-stopped
    volumes:
      - ./website:/usr/share/nginx/html:ro
      - ./nginx/learnword-site.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - web_proxy

networks:
  web_proxy:
    external: true
    name: web_proxy
